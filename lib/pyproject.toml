[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtconnect-explorer-client"
description = "Python client and API schemas for the MTConnectExplorer REST API"
readme = "readme.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2",
    "httpx",
]
dynamic = ["version"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
# Read statically from src/mtconnect_explorer_client/__version__.py — the dotted
# submodule path keeps the build from importing the package (and its deps).
version = { attr = "mtconnect_explorer_client.__version__.__version__" }
