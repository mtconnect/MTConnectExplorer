name: Release

# Fires on EVERY push to release/* — see contributing.md → Triggering a release.
#
# THERE IS DELIBERATELY NO `paths:` FILTER. It used to be
# `paths: ['src/__version__.py']`, which made a merge into a release branch a
# SILENT no-op whenever the version had not changed: GitHub evaluates a push's
# paths filter against a TWO-DOT diff of the push's before/after SHAs, so merging
# main into release/0.1 while both tips carry the same version matched nothing,
# queued no run, and reported nothing anywhere. A release that does not happen
# must not look identical to one that was never asked for.
#
# Firing every time is cheap and safe because the DEDUPE ALREADY EXISTS one layer
# down: the `version` job below sets should_release=false when the tag implied by
# __version__ is already on the remote, and both build jobs are gated on it. So a
# push that cannot release costs one ~15 s job and leaves a ::notice:: saying why
# — visible, instead of silent.
#
# The flip side: a push to a release branch whose version is NOT yet tagged WILL
# publish, whatever files it touched. What decides is tag state, not which paths
# changed. `ci.yml`'s version-check refuses a PR into release/* whose version is
# already tagged, so the mistake is caught before the merge rather than after it.
#
# No recursion: the tag push below is a TAG, and this trigger matches branches.
on:
  push:
    branches: ['release/*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      version: ${{ steps.derive.outputs.version }}
      minor: ${{ steps.derive.outputs.minor }}
      prerelease: ${{ steps.derive.outputs.prerelease }}
      should_release: ${{ steps.derive.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: derive
        shell: bash
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME}"

          # Reads + semver-validates in one place, shared with ci.yml. Do NOT
          # inline a parse here: the two inlined copies this replaced were both
          # unanchored. See the script's header.
          version=$(bash .github/scripts/read-version.sh)

          tag="v$version"

          # Validate branch name matches the version's X.Y line
          if [[ "$branch" =~ ^release/([0-9]+)\.([0-9]+)$ ]]; then
            expected_minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            actual_minor=$(echo "$version" | cut -d'-' -f1 | cut -d. -f1-2)
            if [ "$expected_minor" != "$actual_minor" ]; then
              echo "::error::Branch '$branch' expects version $expected_minor.x, but __version__ is '$version'"
              exit 1
            fi
          else
            echo "::error::Branch '$branch' is not a release branch (expected 'release/X.Y')"
            exit 1
          fi

          # Semver: presence of a `-` suffix marks this as a prerelease.
          if [[ "$tag" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          # On a `push` trigger, skip if the tag already exists on the remote — this
          # commit didn't actually bump the version (e.g. a revert or a no-op edit).
          # On `workflow_dispatch`, always proceed so broken releases can be re-run.
          #
          # THIS IS THE ONLY THING STOPPING A DUPLICATE RELEASE now that the
          # trigger has no paths filter — both build jobs are gated on it. Assign
          # first, then test: `git ls-remote ... | grep -q` would report "tag
          # absent" for a NETWORK failure too (and `grep -q` exits early, so under
          # `pipefail` a SIGPIPE'd producer can fail an otherwise-successful
          # pipeline). With the assignment, `set -e` aborts the job if the query
          # itself fails, which is the safe direction — a failed lookup must never
          # read as "not released yet".
          should_release=true
          if [ "${{ github.event_name }}" = "push" ]; then
            existing=$(git ls-remote --tags origin "refs/tags/$tag")
            if [ -n "$existing" ]; then
              echo "::notice::Tag $tag already exists on remote — skipping (use workflow_dispatch to re-run)"
              should_release=false
            fi
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "minor=$expected_minor"
            echo "prerelease=$prerelease"
            echo "should_release=$should_release"
          } >> "$GITHUB_OUTPUT"

          echo "Branch:         $branch"
          echo "Version:        $version"
          echo "Tag:            $tag"
          echo "Prerelease:     $prerelease"
          echo "Should release: $should_release"

  build-linux:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      ARCHIVE: MTConnectExplorer-v${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build with make
        run: make
      - name: Generate third-party notices
        run: venv/bin/python packaging/generate_notices.py THIRD_PARTY_NOTICES.txt
      - name: Package tar.gz
        run: |
          test -f dist/MTConnectExplorer
          chmod +x dist/MTConnectExplorer
          cp THIRD_PARTY_NOTICES.txt dist/
          tar -czvf "$ARCHIVE" -C dist MTConnectExplorer THIRD_PARTY_NOTICES.txt
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  build-windows:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: windows-latest
    env:
      ARCHIVE: MTConnectExplorer-v${{ needs.version.outputs.version }}-win64.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build with build.bat
        shell: cmd
        run: build.bat ci
      - name: Generate third-party notices
        shell: cmd
        run: venv\Scripts\python.exe packaging\generate_notices.py THIRD_PARTY_NOTICES.txt
      - name: Package zip
        shell: pwsh
        run: |
          if (-not (Test-Path dist\MTConnectExplorer.exe)) {
            throw "dist\MTConnectExplorer.exe not found"
          }
          Copy-Item THIRD_PARTY_NOTICES.txt dist\
          Compress-Archive -Path dist\MTConnectExplorer.exe, dist\THIRD_PARTY_NOTICES.txt -DestinationPath "$env:ARCHIVE" -Force
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    needs: [version, build-linux, build-windows]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts/
      - name: Create and push tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Assign-then-test, not `| grep -q` — see the note in the `version` job.
          existing=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$existing" ]; then
            echo "Tag $TAG already exists on remote — reusing"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: artifacts/*
          fail_on_unmatched_files: true
      - name: Create dev/X.Y staging branch for this line
        env:
          DEV: dev/${{ needs.version.outputs.minor }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # The dev/X.Y staging branch is seeded from the first *stable* release of
          # the line, so it never lags behind release/X.Y at a prerelease commit.
          if [ "$PRERELEASE" = "true" ]; then
            echo "::notice::${{ needs.version.outputs.tag }} is a prerelease — $DEV is created on the first stable release, skipping"
            exit 0
          fi
          existing=$(git ls-remote --heads origin "refs/heads/$DEV")   # see the `version` job
          if [ -n "$existing" ]; then
            echo "::notice::$DEV already exists — leaving it untouched"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git push origin "HEAD:refs/heads/$DEV"
            echo "::notice::Created $DEV at $GITHUB_SHA"
          fi
