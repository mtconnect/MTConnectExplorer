name: CI

# Pre-merge build check. Runs on PRs into the protected staging/release branches
# so a PR can't merge unless the app still builds on both shipped platforms.
# Mark `build-linux`, `build-windows`, and (on release/* branches) `version-check`
# as required status checks on these branches (see contributing.md → Branch
# protection rules).
on:
  pull_request:
    branches: [main, 'dev/*', 'release/*']

# A new push to the same PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-check:
    # Pre-merge guard for release PRs: a PR into release/X.Y must carry a
    # matching X.Y version, so the post-merge release workflow can't fail on a
    # version/branch mismatch. No-op for PRs into main / dev/*.
    # Mark as a required status check on release/* branches.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate __version__ matches the target release branch
        run: |
          base="${{ github.base_ref }}"
          if [[ ! "$base" =~ ^release/([0-9]+)\.([0-9]+)$ ]]; then
            echo "Base branch '$base' is not a release branch; skipping version check."
            exit 0
          fi

          # Read __version__ from src/__version__.py
          version=$(grep -oP '"\K[^"]+' src/__version__.py)
          if [ -z "$version" ]; then
            echo "::error::Failed to parse __version__ from src/__version__.py"
            exit 1
          fi

          # Validate semver (mirrors release.yml)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::__version__ '$version' is not valid semver (expected MAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi

          # Re-match the base branch (the semver test above clobbered BASH_REMATCH)
          # to recover the expected X.Y line, then compare to the version's line.
          [[ "$base" =~ ^release/([0-9]+)\.([0-9]+)$ ]]
          expected_minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          actual_minor=$(echo "$version" | cut -d'-' -f1 | cut -d. -f1-2)
          if [ "$expected_minor" != "$actual_minor" ]; then
            echo "::error::PR targets '$base' which expects version $expected_minor.x, but __version__ is '$version'"
            exit 1
          fi

          echo "OK: __version__ '$version' matches target branch '$base'."

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build with make
        run: make
      - name: Verify binary was produced
        run: test -f dist/MTConnectExplorer

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build with build.bat
        shell: cmd
        run: build.bat ci
      - name: Verify binary was produced
        shell: pwsh
        run: |
          if (-not (Test-Path dist\MTConnectExplorer.exe)) {
            throw "dist\MTConnectExplorer.exe not found"
          }
